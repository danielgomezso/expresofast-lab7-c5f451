<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ExpresoFast</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-login">

    <form id="loginForm" class="form-login">
        <h2>Iniciar Sesión</h2>
        <div id="loginError" class="alerta-error" aria-live="polite"></div>

        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit">Ingresar</button>
    </form>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('loginError');
            errorBox.textContent = '';

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const respuesta = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (respuesta.ok) {
                    const data = await respuesta.json();
                    sessionStorage.setItem('jwt_token', data.token);
                    sessionStorage.setItem('roles', JSON.stringify(data.roles));
                    sessionStorage.setItem('username', data.username);
                    window.location.href = 'dashboard_paginado.html';
                } else {
                    const problema = await respuesta.json();
                    errorBox.textContent = problema.detail || 'Credenciales inválidas';
                }
            } catch (error) {
                errorBox.textContent = 'No se pudo conectar con el servidor';
            }
        });
    </script>
</body>

</html>
