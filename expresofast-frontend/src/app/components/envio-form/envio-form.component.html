<section class="panel">
  <h2>Registrar nuevo envío</h2>
  <p>Todos los campos son obligatorios. El código de rastreo se genera al guardar.</p>
  <form #formulario="ngForm" (ngSubmit)="guardar(formulario)">
    <label for="destinatario">Destinatario</label>
    <input id="destinatario" name="destinatario" [(ngModel)]="envio.destinatario" required maxlength="100">
    <label for="direccion">Dirección de destino</label>
    <textarea id="direccion" name="direccionDestino" [(ngModel)]="envio.direccionDestino" required maxlength="200" rows="3"></textarea>
    <label for="flete">Monto del flete (colones)</label>
    <input id="flete" name="montoFlete" type="number" [(ngModel)]="envio.montoFlete" required min="0.01" max="99999999.99" step="0.01">
    <button [disabled]="formulario.invalid || guardando()">{{ guardando() ? 'Guardando...' : 'Registrar envío' }}</button>
  </form>
  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
  @if (codigo()) {
    <p class="exito" role="status">Envío registrado. Código: <strong>{{ codigo() }}</strong></p>
    <a routerLink="/rastreo" [queryParams]="{ codigo: codigo() }">Rastrear esta guía</a>
  }
</section>
