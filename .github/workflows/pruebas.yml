name: Pruebas y cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: expresofast-backend/pom.xml
      - name: Ejecutar pruebas y exigir cobertura
        working-directory: expresofast-backend
        run: mvn --batch-mode clean verify
      - name: Conservar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            expresofast-backend/target/surefire-reports/
            expresofast-backend/target/site/jacoco/
