spring.application.name=expresofast
spring.config.import=optional:file:./application-local.properties,optional:file:./expresofast/application-local.properties

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ExpresoFast_C5F451_II2026;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

server.servlet.context-path=/
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
