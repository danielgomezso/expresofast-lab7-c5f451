<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>ExpresoFast</h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Monitoreo</a></li>
                <li><button onclick="logout()" style="background: none; border: none; color: white; cursor: pointer;">Salir</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <aside>
            <h2>Filtros</h2>
            <button onclick="filtrarEnvios('TODOS')">Todos</button>
            <button onclick="filtrarEnvios('PENDIENTE')">Pendientes</button>
            <button onclick="filtrarEnvios('EN_TRANSITO')">En Tránsito</button>
            <button onclick="filtrarEnvios('ENTREGADO')">Entregados</button>
        </aside>

        <section id="seccionRegistro">
            <h2>Registrar Envío</h2>
            <form id="formEnvio">
                <input type="text" id="codigoRastreo" placeholder="Código de rastreo" required>
                <input type="text" id="direccionDestino" placeholder="Dirección" required>
                <input type="number" id="pesoKg" placeholder="Peso (kg)" step="0.01" required>
                <input type="number" id="costo" placeholder="Costo total" step="0.01" required>
                <input type="number" id="vehiculoId" placeholder="ID del Vehículo" required>
                <input type="number" id="conductorId" placeholder="ID del Conductor" required>
                <button type="submit">Guardar</button>
            </form>
        </section>

        <section id="contenedorEnvios"></section>
    </main>

    <div id="modalBitacora" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2>Bitácora de Auditoría</h2>
            <div style="margin-bottom: 1rem; display: flex; gap: 10px;">
                <input type="date" id="fechaInicio">
                <input type="date" id="fechaFin">
                <button onclick="filtrarBitacora()" style="padding: 0.5rem;">Filtrar</button>
            </div>
            <table width="100%" border="1" style="border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Anterior</th>
                        <th>Nuevo</th>
                    </tr>
                </thead>
                <tbody id="bodyBitacora"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
